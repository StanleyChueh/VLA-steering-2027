# S2c-0 mechanistic semantic-controllability probe. PREREGISTRATION, frozen before any language query is run.
# Label: DISCOVERY / MECHANISTIC. Uses only already-consumed S2b states 20-29. No rollouts, no CAG change, no omega
# tuning, no horizon change, no new method. States 30-49 are not touched.
#
# Written AFTER S2b outcomes are known (task-level rescue structure motivates this phase); BEFORE any S2c-0 metric
# is computed. The group definitions below are fixed from S2b outcomes and cannot be changed after metrics exist.

question: why is the same frozen pi0.5 highly semantically steerable by CAG on some CF-Spatial tasks and not others?
regimes:
  amplitude_limited: a useful semantic direction exists and CAG points along it, but CAG's shift covers little of it
  direction_limited: the semantic action direction is collapsed (language barely changes the action relative to
                     policy noise) or CAG's direction is misoriented relative to it
  execution_limited: not probed here

data:
  tasks: [0..12]; excluded [13, 14]
  initial_states: [20, 29]
  master_seeds: [0, 1]
  observations: "S2b call-0 policy inputs, regenerated by scripts/audit/s2c0_regen_call0_obs.py; accepted only if
                 geometry and observation hashes equal all four S2b records (result: 130/130)"
  noise: "CRN call-0 noise crn_noise(master_seed, task, init, 0) - identical to S2b call 0; the SAME tensor for every
          language condition of a (seed, task, init); verified per query by fingerprint"
  secondary_noise_draws: "8 extra CRN master seeds 1000..1007 (call index 0), never used before; for a lower-variance
                          noise-floor estimate only"
  reproduction_checks: "A_f(seed s) env-space chunk must equal S2b B call-0 chunk and S2b S call-0 a_conditioned
                        bit-for-bit; A_u must equal S2b S call-0 a_unconditioned bit-for-bit"
  xla_flags: "--xla_gpu_autotune_level=0 --xla_gpu_deterministic_ops=true"

language_conditions: configs/cag/S2c0_language_conditions.json   # resolved before any query; benchmark strings only
  l_f: CF prompt (faithful)
  l_b: instruction of the identical source LIBERO-Spatial training scene (biased / training goal, akita_black_bowl_1)
  l_o: the two remaining benchmark instructions (one per remaining listed condition object)
  l_u: CAG language-masked branch (tokens and mask zeroed; prompt-independent)
  M: 4 instructions per scene in every task (l_f, l_b, 2 x l_o)

actions:
  space: "pre-guidance predicted chunk A[k], k = 0..9, model quantile-normalised space, dims 0-6 (10 x 7)"
  components: {full: [0, 6], trans: [0, 2], rot: [3, 5], grip: [6]}
  norm: Frobenius norm of the (sub)chunk; distances never collapse dims before storage
  stored: all chunks (model and env space) per (task, init, seed, condition)

metrics:   # per scene (task, init); seed-level values averaged over seeds 0 and 1 unless stated
  N_f: "||A_f(xi0) - A_f(xi1)||  (policy-noise variability, same observation and faithful instruction)"
  S_fb: "mean_s ||A_f(xi_s) - A_b(xi_s)||"
  SCNR: "S_fb / (N_f + 1e-6)"           # epsilon for numerical stability only
  SCNR_K: "secondary: mean over 10 draws of ||A_f - A_b|| / mean pairwise ||A_f(xi_i) - A_f(xi_j)|| over 10 draws"
  components: SCNR, S_fb, N_f also per trans / rot / grip
  R_cag: A_f - A_u
  R_fb: A_f - A_b
  ALIGN: "mean_s cos(R_cag(xi_s), R_fb(xi_s)); variants: full flattened chunk (PRIMARY), executed prefix k=0..4,
          each k, trans, rot"
  near_zero: "if ||R_cag|| or ||R_fb|| (same variant) < 1e-3 normalized units, cos is NaN; counted and excluded"
  P_cov: "mean_s (omega - 1) <R_cag, R_fb> / ||R_fb||^2 with omega = 1.5 fixed - the fraction of the faithful-vs-biased
          contrast that CAG's executed shift covers along that contrast (amplitude measure; nothing is tuned)"
  manifold: "per scene and seed, X = rows vec(A_i - mean_j A_j) over the M = 4 instructions; singular values
             s1 >= s2 >= s3; effective rank exp(-sum p ln p), p = s^2 / sum s^2; PC1 explained variance; the 6
             pairwise distances; faithful separation = mean and min distance from A_f to the other 3; spread SNR =
             mean pairwise distance / N_f. A_u reported as distance to the instruction centroid. Averaged over seeds."
  generic_comparators: ["G_mag = mean_k ||A_f[k]|| (generic action magnitude)", "N_f (policy noise)",
                        "L_cag = ||R_cag|| (S2b leverage)"]

s2b_outcomes:   # only S2b labels, no new outcomes
  task_rescue_rate: rescues / B failures per task, pooled seeds
  groups:
    G0_zero_rescue: [1, 4, 5, 10, 11]
    G1_rescued: [0, 2, 3, 7, 8, 9, 12]
    excluded: [6]        # no B failure in S2b; nothing to rescue
  state_level: [rescue (pair), semantic correction (pair)], S2b definitions

statistics:
  task_value: median over the task's 10 scenes
  group_effect: "Cliff's delta (G0 vs G1, task values); median difference G0 - G1 with task-cluster bootstrap 95% CI
                 (resample tasks within each group, 5000)"
  loto: delta recomputed with each of the 12 tasks left out; sign stability reported
  task_spearman: Spearman(task value, task rescue rate) over the 12 tasks, task-bootstrap CI
  state_level: AUROC for S2b rescue (among B-failed pairs) and semantic correction (among B biased-first pairs),
               within-task AUROC; task-ID comparator (seed transfer)
  logistic_regression: secondary diagnostic only
  multiple_metrics: descriptive; the decision uses only the rules below

decision_rules:
  deficiency(m): >-
    G0 is deficient on metric m (lower = worse for SCNR, S_fb, ALIGN, P_cov, faithful separation, spread SNR) iff:
    Cliff's delta <= -0.60, AND the bootstrap CI of the median difference excludes 0, AND delta < 0 in all 12 LOTO
    drops, AND >= 4 of the 5 G0 task values lie below the G1 median.
  comparable(m): Cliff's delta > -0.33
  per_task_low(m, t): a G0 task's value is below the minimum G1 task value
  generic_control: >-
    a deficiency on m counts only if |delta(m)| > |delta(G_mag)| and |delta(m)| > |delta(N_f)|; for SCNR also
    delta(S_fb) <= -0.33 (the deficiency is not produced by the noise denominator alone)
  interpretation:
    collapse: "deficiency(SCNR) [or deficiency(faithful separation / N_f)] -> SEMANTIC CONTROLLABILITY COLLAPSE
               -> direction-limited (collapsed)"
    misorientation: "comparable(SCNR) and deficiency(ALIGN) -> CAG REFERENCE / DIRECTION FAILURE -> direction-limited"
    amplitude: "comparable(SCNR) and comparable(ALIGN) and deficiency(P_cov) -> amplitude-limited"
    neither: "SCNR and ALIGN both comparable and no P_cov deficiency -> the action-space mechanism does not explain
              task-specific steerability"
    mixed: "two distinct per-task patterns (per_task_low SCNR vs [not low SCNR and per_task_low ALIGN or P_cov]) each
            covering >= 2 G0 tasks -> mixed regimes"
  final_decision:
    A: amplitude pattern holds (with generic control)
    B: collapse or misorientation pattern holds (with generic control)
    C: mixed pattern holds
    D: none of the above
  gate_S2c1: >-
    GO to the S2c-1 omega response-surface experiment only if (1) a metric shows a coherent relationship with S2b
    rescue (deficiency(m) holds, or |task Spearman| >= 0.5 with CI excluding 0), AND (2) the G0 group shows a
    reproducible deficiency consistent with amplitude- or direction-limited control (decision A, B or C), AND (3)
    generic_control holds. Otherwise STOP the semantic-controllability hypothesis before consuming states 30-39.
